<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true">

<f:if condition="{version} < 13">
    <div class="widget-content-title d-flex" style="gap:10px;">
        <core:icon identifier="content-audit-widgets-content-statistics" size="small"/>
        <span><f:translate key="widgets.content_statistics.title" extensionName="XimaTypo3ContentAudit"/></span>
    </div>
</f:if>
<div class="widget-content-main x--content-audit-widget--main" style="padding-bottom: 12px;">
    <f:for each="{records}" as="record">
        <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
            <span><f:translate key="widgets.content_statistics.label_{record.label}" extensionName="XimaTypo3ContentAudit"/></span>
            <span class="fw-bold">{record.value}</span>
        </div>
    </f:for>
</div>

</html>
