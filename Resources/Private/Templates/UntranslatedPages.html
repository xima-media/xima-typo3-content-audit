<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:dashboard="http://typo3.org/ns/TYPO3/CMS/Dashboard/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    data-namespace-typo3-fluid="true">

<f:if condition="{version} < 13">
    <div class="widget-content-title d-flex" style="gap:10px;">
        <core:icon identifier="content-audit-widgets-untranslated-pages" size="small"/>
        <span><f:translate key="widgets.untranslated_pages.title" extensionName="XimaTypo3ContentAudit"/></span>
    </div>
</f:if>
<div class="widget-content-main x--content-audit-widget--main" style="--mask: linear-gradient(to bottom, rgba(0, 0, 0, 1) 0, rgba(0, 0, 0, 1) 90%, rgba(0, 0, 0, 0) 95%, rgba(0, 0, 0, 0) 0) 100% 90% / 100% 100% repeat-x;-webkit-mask: var(--mask);mask: var(--mask);">
    <f:if condition="!{translationsConfigured}">
        <div class="row widget-no-items-found">
            <div class="col-xs-12">
                <p>
                    <f:translate key="widgets.untranslated_pages.translations_required" extensionName="XimaTypo3ContentAudit"/>
                </p>
            </div>
        </div>
    </f:if>

    <f:if condition="{translationsConfigured}">
        <f:if condition="{records}">
            <f:then>
                <div class="mb-3">
                    <f:translate key="widgets.untranslated_pages.results" extensionName="XimaTypo3ContentAudit"/>
                    <f:translate key="widgets.untranslated_pages.count" extensionName="XimaTypo3ContentAudit" arguments="{0: matchCount, 1: totalCount}"/>
                </div>
                <div class="widget-table-wrapper">
                    <table class="widget-table {f:if(condition: '{version} >= 13', then: 'table')} table-striped table-hover">
                        <thead>
                        <tr>
                            <th><f:translate key="widgets.untranslated_pages.page" extensionName="XimaTypo3ContentAudit"/></th>
                            <th><f:translate key="widgets.untranslated_pages.path" extensionName="XimaTypo3ContentAudit"/></th>
                            <th><f:translate key="widgets.untranslated_pages.updated" extensionName="XimaTypo3ContentAudit"/></th>
                        </tr>
                        </thead>
                        <tbody>
                        <f:for each="{records}" as="record">
                            <f:render partial="UntranslatedPageItem" arguments="{item: record}"/>
                        </f:for>
                        </tbody>
                    </table>
                </div>
            </f:then>
            <f:else>
                <div class="row widget-no-items-found">
                    <div class="col-xs-12">
                        <p>
                            <f:translate key="widgets.untranslated_pages.empty" extensionName="XimaTypo3ContentAudit"/>
                        </p>
                    </div>
                </div>
            </f:else>
        </f:if>
    </f:if>
</div>
<f:render partial="PageTreeFilterButton" arguments="{records: records, version: version, token: pageTreeFilterToken}"/>

</html>
