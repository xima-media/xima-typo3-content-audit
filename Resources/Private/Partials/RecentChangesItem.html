<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:backend="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    data-namespace-typo3-fluid="true">

<tr>
    <td>
        <span title="ID {item.uid}">
            <f:if condition="{item.recordType} == 'page'">
                <core:icon identifier="apps-pagetree-page" size="small"/>
            </f:if>
            <f:if condition="{item.recordType} != 'page'">
                <core:icon identifier="content-listgroup" size="small"/>
            </f:if>
        </span>
        <f:if condition="{item.isNew}">
            <span class="badge badge-success" title="{f:translate(key: 'widgets.new_title', extensionName: 'XimaTypo3ContentAudit')}">
                <f:translate key="widgets.new" extensionName="XimaTypo3ContentAudit"/>
            </span>
        </f:if>
        <a href="{be:moduleLink(route: 'web_layout', arguments: '{id: item.pageUid}')}"
            target="_blank"
            title="{f:translate(key: 'widgets.backend_link_title', extensionName: 'XimaTypo3ContentAudit')}">
            <f:if condition="{item.recordTitle}" then="{item.recordTitle}"
                else="{f:translate(key: 'widgets.recent_changes.empty_title', extensionName: 'XimaTypo3ContentAudit')}"/>
        </a>
    </td>
    <td>
        <f:if condition="{item.previewUrl}">
            <a href="{item.previewUrl}" target="_blank" title="{f:translate(key: 'widgets.frontend_link_title', extensionName: 'XimaTypo3ContentAudit')}">
                {item.pageSlug}
            </a>
        </f:if>
        <f:if condition="!{item.previewUrl}">
            {item.pageSlug}
        </f:if>
    </td>
    <td>
        <f:if condition="{item.editorName}" then="{item.editorName}" else="-"/>
    </td>
    <td class="text-nowrap">
        <f:format.date format="d.m.Y H:i">{item.changed}</f:format.date>
    </td>
</tr>

</html>
