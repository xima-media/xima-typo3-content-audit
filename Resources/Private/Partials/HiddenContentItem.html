<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:backend="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
    data-namespace-typo3-fluid="true">

<f:comment>
    <f:debug inline="true">{record}</f:debug>
</f:comment>

<tr>
    <td>
        <span title="ID {item.uid}">
            <core:icon identifier="content-listgroup" overlay="overlay-hidden" size="small"/>
        </span>
        <a href="{be:moduleLink(route: 'web_layout', arguments: '{id: item.pid}')}#element-tt_content-{item.uid}"
            title="{f:translate(key: 'widgets.backend_link_title', extensionName: 'XimaTypo3ContentAudit')}">
            <f:if condition="{item.contentTitle}" then="{item.contentTitle}"
                else="{f:translate(key: 'widgets.hidden_content.empty_title', extensionName: 'XimaTypo3ContentAudit')}"/>
        </a>
    </td>
    <td>
        <f:if condition="{item.previewUrl}">
            <a href="{item.previewUrl}" target="_blank" title="{f:translate(key: 'widgets.frontend_link_title', extensionName: 'XimaTypo3ContentAudit')}">
                {item.pageSlug}
            </a>
        </f:if>
        <f:if condition="!{item.previewUrl}">
            {item.pageSlug}
        </f:if>
    </td>
    <td class="text-nowrap">
        <f:format.date format="d.m.Y H:i">{item.updated}</f:format.date>
    </td>
</tr>

</html>
